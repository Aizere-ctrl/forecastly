<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Settings</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
    .account-card {
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 24px;
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(124,58,237,0.15);
      box-shadow: 0 20px 50px rgba(124,58,237,0.1);
    }

    .account-card h2 {
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(124,58,237,0.2);
    }
  </style>
</head>

<body>

<div class="dashboard">

  <aside class="sidebar">
    <div class="logo">
      <img src="{{ url_for('static', filename='images/logo.png') }}">
    </div>

    <nav class="side-nav">
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('upload_data') }}">Upload</a>
      <a href="{{ url_for('library') }}">Library</a>
    </nav>
  </aside>

  <main class="main">

    <div class="account-card">

      <h2>Account Settings</h2>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="notice">
            <span></span>
            {{ messages[0] }}
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST">

        <div class="form-group">
          <label>Name</label>
          <input type="text" name="full_name" value="{{ user.full_name }}">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" value="{{ user.email }}">
        </div>

        <div class="form-group">
          <label>New Password</label>
          <input type="password" name="password" placeholder="Leave empty to keep current">
        </div>

        <button class="btn primary">Save changes</button>

      </form>

    </div>

  </main>

</div>

</body>
</html>
